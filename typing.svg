<svg width="960" height="120" viewBox="0 0 960 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .t {
        font-family: 'JetBrains Mono', monospace;
        font-size: 30px;
        font-weight: 700;
        fill: #1E3A8A;
        filter: url(#glow);
      }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <text x="40" y="55" class="t">
    Exploring AI &amp; Machine Learning
    <animate attributeName="opacity" values="0;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="40" y="55" class="t">
    Interested in Multi-Agent Systems
    <animate attributeName="opacity" values="0;0;1;0" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="40" y="55" class="t">
    Learning Semantic Web Technologies
    <animate attributeName="opacity" values="0;0;0;1;0" dur="16s" repeatCount="indefinite"/>
  </text>

  <text x="40" y="55" class="t">
    Exploring IoT &amp; WoT
    <animate attributeName="opacity" values="0;0;0;0;1" dur="20s" repeatCount="indefinite"/>
  </text>

  <text x="900" y="55" class="t cursor">|</text>

</svg>
