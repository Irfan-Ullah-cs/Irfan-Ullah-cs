<svg width="1000" height="100" viewBox="0 0 1000 100"
     xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- darker gradient -->
  <linearGradient id="auGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%">
      <animate attributeName="stop-color"
        values="#047857;#0e7490;#4338ca;#047857"
        dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%">
      <animate attributeName="stop-color"
        values="#0e7490;#4338ca;#047857;#0e7490"
        dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%">
      <animate attributeName="stop-color"
        values="#4338ca;#047857;#0e7490;#4338ca"
        dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <!-- very light, double-sized radial halo -->
  <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#047857" stop-opacity="0.15">
      <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#047857" stop-opacity="0">
      <animate attributeName="stop-opacity" values="0;0.05;0" dur="6s" repeatCount="indefinite"/>
    </stop>
  </radialGradient>

  <!-- edge fade mask -->
  <linearGradient id="fadeEdge" x1="0%" x2="100%">
    <stop offset="0%" stop-color="white" stop-opacity="0"/>
    <stop offset="8%" stop-color="white" stop-opacity="1"/>
    <stop offset="92%" stop-color="white" stop-opacity="1"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
  <mask id="edgeFade"><rect width="1000" height="100" fill="url(#fadeEdge)"/></mask>

  <!-- glow filter for orbiting dot -->
  <filter id="glow">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
    <feMerge>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- subtle text glow filter -->
  <filter id="textGlow">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- blur-to-focus filters -->
  <filter id="bf1"><feGaussianBlur stdDeviation="0">
    <animate attributeName="stdDeviation" values="8;0;0;0;8;8;8;8" keyTimes="0;0.04;0.20;0.22;0.25;0.5;0.75;1" dur="16s" repeatCount="indefinite"/>
  </feGaussianBlur></filter>
  <filter id="bf2"><feGaussianBlur stdDeviation="0">
    <animate attributeName="stdDeviation" values="8;8;8;0;0;0;8;8" keyTimes="0;0.24;0.25;0.29;0.45;0.47;0.50;1" dur="16s" repeatCount="indefinite"/>
  </feGaussianBlur></filter>
  <filter id="bf3"><feGaussianBlur stdDeviation="0">
    <animate attributeName="stdDeviation" values="8;8;8;0;0;0;8;8" keyTimes="0;0.49;0.50;0.54;0.70;0.72;0.75;1" dur="16s" repeatCount="indefinite"/>
  </feGaussianBlur></filter>
  <filter id="bf4"><feGaussianBlur stdDeviation="0">
    <animate attributeName="stdDeviation" values="8;8;8;0;0;0;8;8" keyTimes="0;0.74;0.75;0.79;0.95;0.97;0.99;1" dur="16s" repeatCount="indefinite"/>
  </feGaussianBlur></filter>

  <!-- clipPaths -->
  <clipPath id="w1">
    <rect x="500" y="0" width="0" height="100">
      <animate attributeName="x"     values="500;150;150;500;500" keyTimes="0;0.05;0.21;0.245;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;700;700;0;0"       keyTimes="0;0.05;0.21;0.245;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="w2">
    <rect x="500" y="0" width="0" height="100">
      <animate attributeName="x"     values="500;500;150;150;500;500" keyTimes="0;0.25;0.30;0.46;0.495;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;700;700;0;0"         keyTimes="0;0.25;0.30;0.46;0.495;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="w3">
    <rect x="500" y="0" width="0" height="100">
      <animate attributeName="x"     values="500;500;150;150;500;500" keyTimes="0;0.50;0.55;0.71;0.745;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;700;700;0;0"         keyTimes="0;0.50;0.55;0.71;0.745;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="w4">
    <rect x="500" y="0" width="0" height="100">
      <animate attributeName="x"     values="500;500;150;150;500;500" keyTimes="0;0.75;0.80;0.96;0.995;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;700;700;0;0"         keyTimes="0;0.75;0.80;0.96;0.995;1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- ===== NEBULA PARTICLES – 30 of them, using darker gradient ===== -->
  <g id="particles">
    <circle cx="120" cy="30" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="120;140;120" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;40;30" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="2.5" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="880;860;880" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;60;70" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="15" r="1.8" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;320;300" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="85" r="2.3" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="5.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="85;75;85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="55" r="1.9" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220;240;220" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="25" r="2.1" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="25;35;25" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="75" r="2.4" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;160;180" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="45" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.8s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="20" r="1.8" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;30;20" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="80" r="2.3" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="6.5s" begin="2.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;580;600" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="40" r="1.8" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="3.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="60" r="2.5" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="5.7s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;50;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="90" r="2.1" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.3s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="10" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="6.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="650;670;650" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="50" r="1.8" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="35" r="2.4" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4.6s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="35;45;35" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="68" r="2.3" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="5.9s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="22" r="1.9" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4.1s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="720;740;720" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="82" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="5.3s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="48" r="2.5" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="6.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="48;38;48" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- additional particles to reach 30 -->
    <circle cx="110" cy="18" r="1.8" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="4.4s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="92" r="2.0" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="5.1s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="890;870;890" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="33" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.9s" begin="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="77" r="2.3" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="5.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="77;67;77" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="63" r="1.9" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4.2s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="28" r="2.4" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="6.3s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="760;780;760" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="95" r="2.1" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.7s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="5" r="2.0" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="5.8s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="52" r="2.5" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="52;62;52" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="41" r="2.2" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="5.4s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="73" r="2.3" fill="url(#auGrad)" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</defs>

<!-- halo -->
<circle cx="500" cy="42" r="480" fill="url(#haloGrad)" opacity="0.6" mask="url(#edgeFade)">
  <animate attributeName="r" values="440;520;440" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- particles -->
<use href="#particles" mask="url(#edgeFade)"/>

<!-- decorative elements -->
<line class="dash-track" x1="80" y1="12" x2="920" y2="12" mask="url(#edgeFade)"/>
<line class="dash-track" x1="80" y1="88" x2="920" y2="88" mask="url(#edgeFade)"/>
<circle class="breathe-ring" cx="500" cy="42" r="36"/>
<line class="center-line" x1="500" y1="18" x2="500" y2="66"/>
<circle class="orb-dot orb-path" r="3.8" opacity="0.7"/>
<line class="eLine eL1" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eR1" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eL2" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eR2" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eL3" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eR3" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eL4" x1="500" y1="42" x2="500" y2="42"/>
<line class="eLine eR4" x1="500" y1="42" x2="500" y2="42"/>
<circle class="spark spL1" cy="42" r="3.0"/>
<circle class="spark spR1" cy="42" r="3.0"/>
<circle class="spark spL2" cy="42" r="3.0"/>
<circle class="spark spR2" cy="42" r="3.0"/>
<circle class="spark spL3" cy="42" r="3.0"/>
<circle class="spark spR3" cy="42" r="3.0"/>
<circle class="spark spL4" cy="42" r="3.0"/>
<circle class="spark spR4" cy="42" r="3.0"/>
<circle class="spark spL1" cy="36" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spR1" cy="48" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spL2" cy="36" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spR2" cy="48" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spL3" cy="36" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spR3" cy="48" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spL4" cy="36" r="2.2" style="animation-delay:0.12s"/>
<circle class="spark spR4" cy="48" r="2.2" style="animation-delay:0.12s"/>

<!-- text with glow -->
<text class="txt v1" x="500" y="42" clip-path="url(#w1)" filter="url(#bf1) url(#textGlow)">Exploring AI &amp; Machine Learning</text>
<text class="txt v2" x="500" y="42" clip-path="url(#w2)" filter="url(#bf2) url(#textGlow)">Interested in Multi-Agent Systems</text>
<text class="txt v3" x="500" y="42" clip-path="url(#w3)" filter="url(#bf3) url(#textGlow)">Learning Semantic Web Technologies</text>
<text class="txt v4" x="500" y="42" clip-path="url(#w4)" filter="url(#bf4) url(#textGlow)">Exploring IoT &amp; WoT</text>

<!-- counter -->
<text class="count c1" x="500" y="80">1 / 4</text>
<text class="count c2" x="500" y="80">2 / 4</text>
<text class="count c3" x="500" y="80">3 / 4</text>
<text class="count c4" x="500" y="80">4 / 4</text>

<style><![CDATA[
.txt{
  font:700 34px 'Segoe UI','Helvetica Neue',sans-serif;
  fill:url(#auGrad);
  text-anchor:middle;
  dominant-baseline:middle;
}
.v1{animation:vis1 16s ease-in-out infinite}
.v2{animation:vis2 16s ease-in-out infinite}
.v3{animation:vis3 16s ease-in-out infinite}
.v4{animation:vis4 16s ease-in-out infinite}
@keyframes vis1{0%,2%{opacity:0}4%,22%{opacity:1}24%,100%{opacity:0}}
@keyframes vis2{0%,24%{opacity:0}27%,47%{opacity:1}49%,100%{opacity:0}}
@keyframes vis3{0%,49%{opacity:0}52%,72%{opacity:1}74%,100%{opacity:0}}
@keyframes vis4{0%,74%{opacity:0}77%,97%{opacity:1}99%,100%{opacity:0}}

.dash-track{
  stroke:url(#auGrad);
  stroke-width:2;
  stroke-dasharray:5 10;
  stroke-linecap:round;
  opacity:0.3;
  animation:dashScroll 12s linear infinite;
}
@keyframes dashScroll{to{stroke-dashoffset:-90}}

.breathe-ring{
  fill:none;
  stroke:url(#auGrad);
  stroke-width:2;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{r:30; opacity:0.25}
  50%{r:46; opacity:0.6}
}

.center-line{
  stroke:url(#auGrad);
  stroke-width:2.5;
  stroke-linecap:round;
  animation:cPulse 3s ease-in-out infinite;
}
@keyframes cPulse{
  0%,100%{opacity:0.3; stroke-width:2}
  50%{opacity:0.7; stroke-width:4}
}

.orb-dot{
  fill:url(#auGrad);
  filter:url(#glow);
  opacity:0.7;
}
.orb-path{
  animation:orbit 16s linear infinite;
}
@keyframes orbit{
  0%{transform:translate(570px,42px)}
  25%{transform:translate(500px,68px)}
  50%{transform:translate(430px,42px)}
  75%{transform:translate(500px,16px)}
  100%{transform:translate(570px,42px)}
}

.eLine{
  stroke:url(#auGrad);
  stroke-width:2.5;
  stroke-linecap:round;
  opacity:0;
}
.eL1{animation:eLineL 16s ease-in-out infinite}
.eR1{animation:eLineR 16s ease-in-out infinite}
.eL2{animation:eLineL 16s 4s ease-in-out infinite}
.eR2{animation:eLineR 16s 4s ease-in-out infinite}
.eL3{animation:eLineL 16s 8s ease-in-out infinite}
.eR3{animation:eLineR 16s 8s ease-in-out infinite}
.eL4{animation:eLineL 16s 12s ease-in-out infinite}
.eR4{animation:eLineR 16s 12s ease-in-out infinite}

@keyframes eLineL{
  0%,1%{x1:500; x2:500; opacity:0}
  3%{x1:500; x2:480; opacity:0.9}
  5%{x1:120; x2:390; opacity:0.8}
  20%{x1:120; x2:390; opacity:0.8}
  23%{x1:500; x2:500; opacity:0}
  25%,100%{opacity:0}
}
@keyframes eLineR{
  0%,1%{x1:500; x2:500; opacity:0}
  3%{x1:520; x2:500; opacity:0.9}
  5%{x1:610; x2:880; opacity:0.8}
  20%{x1:610; x2:880; opacity:0.8}
  23%{x1:500; x2:500; opacity:0}
  25%,100%{opacity:0}
}

.spark{
  fill:url(#auGrad);
  opacity:0;
}
.spL1{animation:spkL 16s ease-out infinite}
.spR1{animation:spkR 16s ease-out infinite}
.spL2{animation:spkL 16s 4s ease-out infinite}
.spR2{animation:spkR 16s 4s ease-out infinite}
.spL3{animation:spkL 16s 8s ease-out infinite}
.spR3{animation:spkR 16s 8s ease-out infinite}
.spL4{animation:spkL 16s 12s ease-out infinite}
.spR4{animation:spkR 16s 12s ease-out infinite}

@keyframes spkL{
  0%{cx:500; opacity:0}
  1%{cx:490; opacity:1}
  5%{cx:140; opacity:0}
  6%,100%{opacity:0}
}
@keyframes spkR{
  0%{cx:500; opacity:0}
  1%{cx:510; opacity:1}
  5%{cx:860; opacity:0}
  6%,100%{opacity:0}
}

.count{
  font:500 11px 'Segoe UI',sans-serif;
  fill:url(#auGrad);
  text-anchor:middle;
  opacity:0;
}
.c1{animation:cF1 16s linear infinite}
.c2{animation:cF2 16s linear infinite}
.c3{animation:cF3 16s linear infinite}
.c4{animation:cF4 16s linear infinite}
@keyframes cF1{0%{opacity:0}2%{opacity:0.4}22%{opacity:0.4}24%{opacity:0}25%,100%{opacity:0}}
@keyframes cF2{0%,25%{opacity:0}27%{opacity:0.4}47%{opacity:0.4}49%{opacity:0}50%,100%{opacity:0}}
@keyframes cF3{0%,50%{opacity:0}52%{opacity:0.4}72%{opacity:0.4}74%{opacity:0}75%,100%{opacity:0}}
@keyframes cF4{0%,75%{opacity:0}77%{opacity:0.4}97%{opacity:0.4}99%{opacity:0}100%{opacity:0}}
]]></style>
</svg>
